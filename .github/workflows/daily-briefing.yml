name: Daily Briefing

on:
  schedule:
    # 15:00 UTC = 8:00 AM Pacific Daylight Time. During Pacific Standard
    # Time (winter) this runs at 7:00 AM local instead -- GitHub Actions
    # cron doesn't follow DST. Adjust to 16:00 in winter if that matters.
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run agent and send email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m news_agent.main

      - name: Commit updated history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "Update sent-article history"
          git push

      - name: Pause the daily schedule after a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Run failed -- disabling this workflow's schedule so it doesn't keep failing daily."
          echo "Check the logs above for why, fix it (e.g. top up Anthropic credits), then re-enable with:"
          echo "  gh workflow enable daily-briefing.yml"
          gh workflow disable daily-briefing.yml
